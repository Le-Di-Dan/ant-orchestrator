[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ant-orchestrator"
version = "0.0.0"
description = "Ant-Orchestrator — AI development orchestration system (Phase 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-pyyaml",
]

[project.scripts]
ant = "ant_orchestrator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ant_orchestrator"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# E,W: pycodestyle | F: pyflakes | I: isort | B: flake8-bugbear | UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

