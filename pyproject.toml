[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ant-orchestrator"
version = "0.0.0"
description = "Ant-Orchestrator — AI development orchestration system (Phase 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pyyaml",
    # LLM gateway (ADR-0003). Narrow range: tested on 1.89.3; LiteLLM may break on
    # minor bumps, so cap below the next minor to avoid untested releases.
    "litellm>=1.89.3,<1.90",
    # Workflow engine + durable checkpointer (Phase 4 CP3). Tested on langgraph
    # 1.2.6 / checkpoint-sqlite 3.1.0; capped below the next minor/major to avoid
    # untested releases. Used only in workflows/ (see import-boundary tests).
    "langgraph>=1.2.6,<1.3",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    # FastAPI surface (Phase 7 CP7). httpx provides TestClient via starlette[full].
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-pyyaml",
]

[project.scripts]
ant = "ant_orchestrator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ant_orchestrator"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# E,W: pycodestyle | F: pyflakes | I: isort | B: flake8-bugbear | UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
no_implicit_reexport = true

# LiteLLM's package re-exports are not declared for strict checkers; treat it as an
# untyped boundary (seam/error-mapping modules only). Does not relax our code.
[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
follow_imports = "skip"
ignore_missing_imports = true

# LangGraph + LangChain re-exports are an untyped boundary for strict checkers; treat
# them as such (confined to workflows/ wiring). Does not relax our own code.
[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*", "langchain_core", "langchain_core.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_openai: real OpenAI call via LiteLLM (skipped by default; needs OPENAI_API_KEY + ANT_LIVE_OPENAI_MODEL)",
    "live_ollama: real local Ollama call (skipped by default; needs ANT_LIVE_OLLAMA_MODEL + ANT_LIVE_OLLAMA_BASE_URL)",
]

